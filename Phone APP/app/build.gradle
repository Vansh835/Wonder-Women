plugins {
    id 'com.android.application'
}

android {
    namespace 'com.womensafety.phoneapp'
    compileSdk 36

    defaultConfig {
        applicationId 'com.womensafety.phoneapp'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.17.1'
}
